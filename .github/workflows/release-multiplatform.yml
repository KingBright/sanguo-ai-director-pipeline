name: Release Multiplatform (Director Studio & MCP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Name (e.g., v0.1.0)'
        required: false
        default: 'draft-latest'

permissions:
  contents: write

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: director-studio-darwin-arm64
            archive_ext: tar.gz
            exe_ext: ""

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: director-studio-darwin-x86_64
            archive_ext: tar.gz
            exe_ext: ""

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: director-studio-linux-x86_64
            archive_ext: tar.gz
            exe_ext: ""

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: director-studio-windows-x86_64
            archive_ext: zip
            exe_ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build Release Binaries (director-server & director-mcp)
        run: cargo build --release --workspace --bins --target ${{ matrix.target }}

      - name: Package Release Archive (POSIX)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          DIST_DIR="dist/${{ matrix.artifact_name }}"
          mkdir -p "$DIST_DIR"
          cp "target/${{ matrix.target }}/release/director-server${{ matrix.exe_ext }}" "$DIST_DIR/"
          cp "target/${{ matrix.target }}/release/director-mcp${{ matrix.exe_ext }}" "$DIST_DIR/"
          cp scripts/run_director_service.sh "$DIST_DIR/" || true
          cp README.md "$DIST_DIR/" || true
          cp -r plugins "$DIST_DIR/" || true
          tar -czvf "dist/${{ matrix.artifact_name }}.tar.gz" -C dist "${{ matrix.artifact_name }}"

      - name: Package Release Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $DistDir = "dist/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $DistDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/director-server.exe" -Destination "$DistDir/"
          Copy-Item "target/${{ matrix.target }}/release/director-mcp.exe" -Destination "$DistDir/"
          Copy-Item "1_点击登录.bat" -Destination "$DistDir/" -ErrorAction SilentlyContinue
          Copy-Item "README.md" -Destination "$DistDir/" -ErrorAction SilentlyContinue
          if (Test-Path "plugins") { Copy-Item -Recurse "plugins" -Destination "$DistDir/" }
          Compress-Archive -Path "$DistDir" -DestinationPath "dist/${{ matrix.artifact_name }}.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          draft: false
          prerelease: false
          generate_release_notes: true

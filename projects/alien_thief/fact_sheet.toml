banned_topology_contradictions = ["boardroom", "ancient tent"]

[spatial_rooms.room_lanke_tavern]
description = "地下霓虹牌桌酒馆（180度南向机位锁）：左里贝抱头抓狂、中悬浮扑克筹码圆桌、右西木顶着白猫与联盟抓捕队长同桌斗地主"
camera_left = "Libei clutching his frog-hood head in utter panic beside spilled energy mugs"
center_foreground = "Floating magnetic card poker table with spinning holographic chips"
camera_right = "Ximu wearing a smug grin with a fluffy white cat perched on his head playing cards with the Alliance Captain"
interior_anchor_image = "characters/images/ximu_anchor.png"
banned_topology_contradictions = ["boardroom", "ancient tent"]

[acoustic_spaces.ruin_wind_ambience]
description = "废墟荒原呼啸狂风与外星杂音底噪"
ffmpeg_bg_filter = "volume=0.30"
h3_audio_cue = "Sound: howling wasteland wind, gritty rustling debris, distant alien bazaar hum."

[acoustic_spaces.neon_kiosk_hum]
description = "杂货铺高频霓虹电流蜂鸣与全息警报滴滴声"
ffmpeg_bg_filter = "lowpass=f=2400,volume=0.25"
h3_audio_cue = "Sound: buzzing neon transformer hum, digital register beeps, electronic scratch ticker."

[acoustic_spaces.tavern_jazz_chatter]
description = "地下酒馆怪诞喧闹外星爵士乐与酒杯碰擦声"
ffmpeg_bg_filter = "lowpass=f=1800,volume=0.22"
h3_audio_cue = "Sound: quirky offbeat alien jazz trumpet, clinking glass mugs, murmur of gambling aliens."

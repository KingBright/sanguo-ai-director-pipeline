# ============================================================================
# 《三国：逆天改命》产线事实表 (Production Line Fact Sheet v2.4 - L1~L5 工业化导演架构)
# 融合自 open-ai-canvas (S1-S6 短剧六工位体系) 与《工业化AI视频制作工作流：L1-L5导演决策SOP》
# 铁律：
#   1. L1 叙事与弧光锁：
#      - 契诃夫之枪静默埋设（铺垫期伏笔绝不进台词明牌，回收期自然兑现）；
#      - 细节体现律（全剧严禁台词直白说出“远视眼/老花眼/凸透镜/度数”等现代验光词，全靠“竹简拉远微眯、凸透镜微距放大、镜片寒光震慑敌哨”等物理光学画面体现）；
#      - 人物心理必须经历四阶段单调非递减演进；
#   2. L2 视觉资产与全局事实锁：真实画面比形容词可靠（必须绑定定妆参考母图 @ref_image），双向时代服化道物理隔离；
#   3. L3 视听空间调度与三维拓扑锁：
#      - 场次必须先有外景建置 (Establishing) 再切入内景；
#      - 同场次跨镜必须绑定 `[spatial_rooms]` 统一三维空间坐标系（锁死左/中/右/前景/背景拓扑与 180° 轴线，严禁左右颠倒或窗户平面瞬移）；
#      - 关窗/帐内雨风声必须施加物理低通滤波 (LPF)；
#   4. L4 去文学化可拍性与台词视觉证据锁：
#      - 严禁中英文抽象文学废话与不可拍心理词进入视频提示词，强制校验物理焦段与运镜矢量；
#      - 台词指涉物（如“漫展行头拍出来”）必须在画面中有直接视觉证据（显示器打开漫展活动现场返图相册 + 桌面单反相机）；
#   5. L5 双引擎分级渲染：先本地 H3 / 云端 Lite 预演，确认预算与运镜后再调用 Veo 3.1 Quality。
# ============================================================================

[project]
id = "sanguo"
name = "三国：逆天改命·诸葛亮北伐"
pipeline_type = "drama_s1_s6_l1_l5"
episode_aspect = "16:9"
historical_anchor_year = "蜀汉建兴六年（公元228年，距今近一千八百年）"

[style_lock]
camera_base = "Shot on ARRI Alexa 65 with Panavision anamorphic lens"
lighting_base = "live-action cinematic realism blended with Rembrandt classical oil-painting chiaroscuro lighting, real human skin micro-texture, rich warm amber/tungsten highlights against deep slate shadows"
film_stock = "fine Kodak Vision3 500T film grain, 8k cinematic color grading"
global_suffix = "Shot on ARRI Alexa 65 with Panavision anamorphic lens, live-action cinematic historical drama realism blended with Rembrandt classical oil-painting chiaroscuro lighting, real human skin micro-texture, rich warm amber/tungsten highlights against deep slate shadows, fine Kodak Vision3 500T film grain, 8k cinematic color grading."
modern_suffix = "Shot on ARRI Alexa 65 with Panavision anamorphic lens, live-action cinematic realism blended with Rembrandt classical oil-painting chiaroscuro lighting, real human skin micro-texture, rich warm tungsten desk lamp highlights against deep slate shadows, fine Kodak Vision3 500T film grain, 8k cinematic color grading. Clean video without any subtitles or text."
negative_prompt = "cartoon, anime, 3d render, plastic skin, fantasy magic glow, neon lights, watermark, floating text, gibberish subtitles, deformed face, extra limbs"

[director_rules]
# L1 契诃夫之枪静默保护：
#   1) 铺垫期 (phase_1 / phase_2) 严禁在台词中直接点破“备用眼镜/穿越”；
#   2) 全剧任何阶段 (phase_1 ~ phase_4) 严禁在台词中直白说出“远视眼/老花眼/凸透镜/度数”等现代验光术语，必须完全靠物理动作与细节体现！
silent_foreshadow_keywords_banned_in_dialogue = [
    "备用眼镜", "第二副眼镜", "两副眼镜", "眼镜盒", "穿越回去", "带回三国", "未来转折", "备用明目镜",
    "远视眼", "老花眼", "凸透镜", "度数", "屈光"
]
always_banned_explicit_medical_terms_in_dialogue = [
    "远视眼", "老花眼", "凸透镜", "远视度数", "屈光度", "备用明目镜"
]

# L4 去文学化可拍性拦截：以下不可拍的中英文抽象修辞或纯心理描写严禁出现在视频生成提示词 (action) 中
banned_literary_vagueness_in_action = [
    "内心涌起", "意识到真相", "史诗感", "高级感", "宿命感", "酷炫", "炸裂", "心想", "仿佛看到",
    "inner bitterness", "realizes the", "realizing the", "feels a sense of", "thinks in his heart",
    "unspoken emotion", "profound warmth and quiet emotion", "epic vibe", "cool vibe", "sense of destiny"
]

# L1 人物心理渐进四阶段定义（分镜必须按阶段单调非递减演进）
psychological_arc_phases = [
    "phase_1_daily_empathy",        # 日常共情与历史遗憾铺垫（如漫展归来看Cos返图感慨丞相）
    "phase_2_sudden_accident",      # 物理因果触发的突发意外（如雨后路滑突发车祸，本能反应）
    "phase_3_shock_and_denial",     # 生理苏醒与怀疑否认（以为在宿舍/剧组拍戏）
    "phase_4_evidence_awakening"    # 物理铁证冲击下的时空确认、智谋破局与伏笔回收觉醒
]

# L5 语音韵律与多音字防断词字典（防止 TTS 极速压缩失真、把“替丞相”拆成“替城/相”或把“行头/长使”读错）
tts_max_rate_percent = 12
[director_rules.tts_pronunciation_overrides]
"孔明行头" = "孔明行装"
"长使英雄泪满襟" = "出师未捷，身先死，常使英雄，泪满襟"
"替丞相守住" = "为丞相守住"

# L4 台词指涉物与画面视觉证据强制映射表（Dialogue Referent -> Required Action Visual Evidence）
[[director_rules.dialogue_visual_evidence_rules]]
dialogue_trigger = "漫展"
required_any_in_action = ["cosplay photo", "convention photo", "photo album", "photo gallery"]
description = "台词提及漫展拍摄时，画面中的显示器必须明确展示漫展现场 Cosplay 活动照片/相册缩略图及单反导图细节，严禁只放无关地图"

[[director_rules.dialogue_visual_evidence_rules]]
dialogue_trigger = "拨云见日"
required_any_in_action = ["convex", "magnif", "arm's length"]
description = "台词体现丞相看清竹简细字时，画面必须展示『原本伸直手臂拿远微眯 -> 透过远视凸透镜微距放大竹简细字、眉头舒展』的物理光学细节"

[[director_rules.dialogue_visual_evidence_rules]]
dialogue_trigger = "目中寒光"
required_any_in_action = ["convex", "flash of cold white light", "glint"]
description = "台词体现敌军/武将畏惧神光时，画面必须展示阳光或火把照射在凸透镜片上折射出刺目双道冷白寒光及敌哨惊退的物理细节"

[spatial_rooms]
# L3 同场次跨镜三维空间拓扑坐标系（锁死房间左/中/右/前/后几何关系与外景/内景配对首帧母图）
[spatial_rooms.anime_convention_hall]
description = "高校三国动漫展室内主展厅（统一展台互动区三维空间拓扑：前景Z=0为单反摄影师与举手机围观观众，中景Z=3左侧为赵云/孙尚香等其他三国Coser互动合拍区、右侧为身着孔明鹤氅纶巾的主角顾渊，背景Z=10为高挑现代会展穹顶、三国主题展位横幅与舞台暖金追光灯架）"
camera_left = "enthusiastic convention photographers with DSLR cameras, cheering college students holding up smartphones, and fellow Three Kingdoms cosplayers (Zhao Yun in silver armor, Sun Shangxiang in red Hanfu) interacting and taking selfies"
center_foreground = "camera flashes, DSLR lenses, and white crane feather fan held by GuYuan"
camera_right = "21-year-old GuYuan in full Zhuge Liang cosplay (tall teal GuanJin headdress, white crane-patterned robe HeChang, sleek black-rimmed farsighted eyeglasses, matte-black spare eyeglasses case at waist sash)"
exterior_anchor_image = "characters/images/ep01_00a_convention_stage_anchor.jpg"
interior_anchor_image = "characters/images/ep01_00b_convention_selfie_anchor.jpg"
banned_topology_contradictions = [
    "empty hall",
    "outdoor street",
    "rainy forest"
]

[spatial_rooms.dorm_room_night]
description = "顾渊大学宿舍夜间书桌区（统一外景透窗与内景近景的三维空间拓扑与 Z 轴深度：窗户在前景 Z=0，书桌与人物在 Z=2，背景 Z=10 为左侧木书柜与右侧宿舍上下铺）"
camera_left = "27-inch PC monitor displaying convention cosplay photo album + warm brass desk lamp + upper wooden bookshelf"
center_foreground = "wooden desk right inside the foreground window with open matte-black hard-shell eyeglasses case (holding spare convex glasses), white crane feather fan, folded teal GuanJin headscarf, DSLR camera, dark trekking backpack"
camera_right = "21-year-old GuYuan seated in dark charcoal hoodie & vest facing camera-left toward the monitor, with college dorm bunk beds in the background shadow behind him"
exterior_anchor_image = "characters/images/ep01_01_exterior_window_anchor.jpg"
interior_anchor_image = "characters/images/ep01_02_interior_cosplay_screen_anchor.jpg"
banned_topology_contradictions = [
    "monitor on the right",
    "facing right toward monitor",
    "lamp on the far right",
    "window behind him",
    "curtains behind him",
    "window in the background"
]

[spatial_rooms.qishan_command_tent]
description = "蜀汉祁山大营中军帅帐三维坐标系"
camera_left = "wooden campaign desk under flickering oil candlelight where Chancellor Zhuge Liang sits"
center_foreground = "clay topographical sand table of Jieting and wooden command token"
camera_right = "tent entrance and assembled Shu Han generals"
interior_anchor_image = "characters/images/zhugeliang_v2.jpg"
banned_topology_contradictions = []

[acoustic_spaces]
# L3 声画空间物理一致性矩阵（FFmpeg 音频滤波器参数 + H3 原生声学提示词）
[acoustic_spaces.convention_hall_bustling]
description = "热闹非凡的室内动漫展场馆空间（快门连拍咔嚓声、观众欢呼赞美声、展馆混响与轻快国风背景氛围音）"
ffmpeg_bg_filter = "volume=0.80"
h3_audio_cue = "Sound: lively bustling indoor anime convention hall ambiance, rapid DSLR camera shutter clicks, cheerful crowd chatter and warm applause."

[acoustic_spaces.exterior_storm]
description = "室外雨夜/风暴全频段空间（允许清晰大雨声与雷声）"
ffmpeg_bg_filter = "volume=0.85"
h3_audio_cue = "Sound: heavy rain pouring outside hitting window glass and leaves, distant low thunder."

[acoustic_spaces.interior_closed]
description = "门窗关闭的温暖室内空间（室外雨声必须经墙体/玻璃低通滤波变闷压低，凸显室内近场动作音）"
ffmpeg_bg_filter = "lowpass=f=420,volume=0.18"
h3_audio_cue = "Sound: quiet warm indoor room tone, very faint muffled rain outside the closed window, subtle mouse click and gentle rustle of a feather fan."

[acoustic_spaces.exterior_street_wet]
description = "次日雨后湿滑街道外景（轮胎涉水声、急刹摩擦声、低频撞击声）"
ffmpeg_bg_filter = "volume=0.90"
h3_audio_cue = "Sound: wet city street ambiance, car tires splashing water, sudden sharp tire screech on wet asphalt, heavy impact sub-bass drop."

[acoustic_spaces.ancient_battlefield]
description = "古代秦岭泥泞山谷与军营外景（寒风、木轮陷泥声、甲叶碰撞声、战鼓声）"
ffmpeg_bg_filter = "volume=0.75"
h3_audio_cue = "Sound: howling mountain wind, wooden cart wheels groaning in deep mud, clinking iron armor, distant low war horns."

[acoustic_spaces.ancient_tent_interior]
description = "古代中军帅帐内景（帐外寒风经厚重牛皮帐篷 380Hz 低通滤波变闷，凸显帐内烛火噼啪声、竹简与令箭碰撞声）"
ffmpeg_bg_filter = "lowpass=f=380,volume=0.22"
h3_audio_cue = "Sound: quiet military command tent interior, faint muffled wind outside the heavy canvas tent, soft crackle of oil lamps and rustle of bamboo slips."

[engines.cloud_google_flow]
platform = "flow.google.com"
project_id = "a4467199-16db-464b-860b-2a4efb46e00c"
